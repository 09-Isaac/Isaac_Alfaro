<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Isaac Alfaro">
    <meta name="keywords" content="música, canciones, artistas">
    <link rel="stylesheet" href="css/cancion.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Formulario de Canción</title>
</head>

<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html" target="_parent">Home</a></li>
                <li><a href="Disco.html" target="_parent">Disco</a></li>
                <li><a href="Cantante.html" target="_parent">Cantante</a></li>
                <li><a href="Playlist.html" target="_parent">Playlist</a></li>
            </ul>
        </nav>
    </header>


    <main>
        <section id="principal">
            <article>
                <form name="frmCancion" id="frmCancion">
                    <fieldset id="datos_cancion">
                        <legend>Datos de canción:</legend>
                        <section id="nombre_duracion">
                            <article>
                                <label for="nombre">Nombre de la canción:</label>
                                <input type="text" id="nombre" name="nombre">
                            </article>
                            <article>
                                <label for="duracion">Duración (min):</label>
                                <input type="number" id="duracion" name="duracion" min="1">
                            </article>
                        </section>
                        <section id="compositor_cantante">
                            <article>
                                <label for="compositor">Compositor:</label>
                                <input type="text" id="compositor" name="compositor">
                            </article>
                            <article>
                                <label for="cantante">Cantante:</label>
                                <input type="text" id="cantante" name="cantante">
                            </article>
                        </section>
                    </fieldset>

                    <button type="button" id="boton" onclick="mi_metodo()">
                        Guardar
                    </button>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>LSDM401</p>
        <p>Isaac Alfaro</p>
    </footer>

    <script src="js/confirmado.js"></script>
</body>
</html>
